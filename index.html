<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1628" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Leeds – Platform Indicator</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="board" class="platform-board">
    <header class="board-header">
      <div class="station-name">Leeds</div>
      <div class="clock" id="clock">--:--:--</div>
    </header>

    <!-- NEXT train -->
    <section class="service-slot next-slot" id="next-slot">
      <div class="slot-label">Next</div>
      <div class="service-content" id="next-content">
        <div class="loading">Loading…</div>
      </div>
    </section>

    <!-- FOLLOWING train (cycles) -->
    <section class="service-slot following-slot" id="following-slot">
      <div class="slot-label">Following</div>
      <div class="service-content" id="following-content">
        <div class="loading">Loading…</div>
      </div>
    </section>

    <footer class="board-footer">
      <span id="platform-note">Platform indicator simulation</span>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
